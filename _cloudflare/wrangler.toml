name = "rangang-site"
compatibility_date = "2026-11-01"
pages_build_output_dir = "."

# 站点内容库：后台保存的整包 JSON 存在这里
[[d1_databases]]
binding = "DB"
database_name = "rangang"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 图片 / 视频：R2 桶（不绑定也能用，只是后台不能直传，只能手填路径）
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "rangang-media"

# ADMIN_TOKEN 不要写在这里（会进仓库）。
# 本地开发：新建 .dev.vars 写 ADMIN_TOKEN=你的密码
# 线上：Cloudflare 控制台 → 项目 → Settings → Variables and Secrets 添加 ADMIN_TOKEN（类型选 Secret）
